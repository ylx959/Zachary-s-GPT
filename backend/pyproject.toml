[project]
name = "zacharygpt"
version = "0.1.0"
description = "Agentic AI chatbot built with FastAPI, LangGraph and Gemini"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "docx2txt==0.9",
    "fastapi==0.136.3",
    "flashrank>=0.2.10",
    "langchain==1.3.2",
    "langchain-chroma==1.1.0",
    "langchain-core==1.4.0",
    "langchain-google-genai==4.2.4",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.2",
    "langgraph-checkpoint-sqlite==3.1.0",
    "pydantic-settings>=2.16.3",
    "pypdf==6.12.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.29",
    "sqlalchemy==2.0.50",
    "tavily-python==0.7.24",
    "uvicorn==0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: calls real model APIs (run with: uv run pytest -m integration)"]
